name = "chikane-garage"
compatibility_date = "2024-09-01"
pages_build_output_dir = ".vercel/output/static"

# Variáveis de ambiente (definidas no Cloudflare Dashboard → Settings → Environment variables)
# Supabase
# NEXT_PUBLIC_SUPABASE_URL = "..."
# NEXT_PUBLIC_SUPABASE_ANON_KEY = "..."
# R2
# R2_ACCOUNT_ID = "..."
# R2_ACCESS_KEY_ID = "..."
# R2_SECRET_ACCESS_KEY = "..."
# R2_BUCKET = "vehicle-images"
# R2_PUBLIC_URL = "https://pub-xxx.r2.dev"  # ou domínio customizado

# Next.js middleware compatível com edge - o wrangler compila automaticamente
# para Pages Functions se existir middleware.ts na raiz