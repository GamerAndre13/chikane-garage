name: Lighthouse em staging

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

jobs:
  lighthouse:
    if: ${{ vars.STAGING_BASE_URL != '' && vars.PRODUCTION_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Confirmar destino não produtivo
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: |
          node -e 'const s=new URL(process.env.STAGING_BASE_URL),p=new URL(process.env.PRODUCTION_BASE_URL); if(s.protocol!=="https:" || s.origin===p.origin || ["chikanegarage.blog","www.chikanegarage.blog"].includes(s.hostname.toLowerCase())) process.exit(1)'
      - name: Medir experiência com Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ vars.STAGING_BASE_URL }}
          uploadArtifacts: true
          temporaryPublicStorage: false
          runs: 3
      - name: Guardar relatório Lighthouse
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-staging
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14
