name: Qualidade

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qualidade:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Verificar tipos
      run: npm run typecheck

    - name: Executar testes unitários
      run: npm test

    - name: Analisar ficheiros de QA
      run: npx eslint vitest.config.mts playwright.config.ts tests/unit/vehicle-visibility.test.ts tests/e2e/public-journeys.spec.ts scripts/check-staging-supabase.mjs

    - name: Construir aplicação
      # O OpenNext que já publica no Worker usa Webpack; no Next 16 o build
      # direto escolhe Turbopack e falha ao resolver next/font/google neste repo.
      run: npx next build --webpack
      env:
        NEXT_PUBLIC_SUPABASE_URL: https://qa-build.supabase.co
        NEXT_PUBLIC_SUPABASE_ANON_KEY: qa-build-anon-key-not-a-secret
        NEXT_PUBLIC_SITE_URL: https://qa-build.example.invalid

    - name: Guardar relatório dos testes
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: relatorio-testes-unitarios
        path: test-results/
        if-no-files-found: ignore
        retention-days: 7
